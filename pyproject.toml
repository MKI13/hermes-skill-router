[project]
name = "hermes-skill-router"
version = "0.7.0"
description = "Profile-scoped deterministic, local-embedding, and optional OpenViking skill routing for Hermes Agent."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
