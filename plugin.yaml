name: skill-router
version: 0.7.0
manifest_version: 2
api_version: 1
description: Keep a profile-specific plan for routing tasks to installed skills.
author: Hermes Skill Router contributors
license: MIT
tags: [skills, routing, openviking, profiles, orchestration, embeddings, codebase-memory]
provides_hooks:
  - on_session_start
  - on_skill_lifecycle
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
config_schema:
  routing_mode:
    type: str
    default: deterministic
    description: "Routing mode: deterministic, hybrid/embedding, or model. Hybrid uses direct local embeddings with deterministic fail-open."
  deep_refresh_on_start:
    type: bool
    default: true
    description: Analyze all changed skills with the configured auxiliary model when a session starts.
  rescan_interval_seconds:
    type: int
    default: 60
    description: Minimum interval between catalog freshness checks.
  max_skills_per_task:
    type: int
    default: 4
    description: Maximum number of skills recommended for one task.
  deterministic_min_score:
    type: int
    default: 20
    description: Minimum deterministic score for selecting a primary skill.
  deterministic_supporting_min_score:
    type: int
    default: 24
    description: Minimum relevance score for an optional deterministic supporting skill.
  max_optional_supporting_skills:
    type: int
    default: 2
    description: Maximum optional supporting skills; declared dependencies are not counted.
  followup_context_enabled:
    type: bool
    default: true
    description: Conservatively reuse the previous session primary only when normal routing abstains on a short referential follow-up.
  followup_context_max_sessions:
    type: int
    default: 32
    description: Maximum bounded profile-local session routing-context records.
  embedding_url:
    type: str
    default: "http://127.0.0.1:11436"
    description: Loopback-only Ollama origin used by hybrid/embedding routing.
  embedding_model:
    type: str
    default: "qwen3-embedding:0.6b"
    description: Ollama embedding model; no generative model is called for hybrid routing.
  embedding_dimensions:
    type: int
    default: 1024
    description: Exact vector dimension required from the embedding response.
  embedding_timeout_seconds:
    type: float
    default: 5.0
    description: Per-request embedding timeout, clamped from 0.05 to 30 seconds.
  embedding_keep_alive:
    type: str
    default: "5m"
    description: Ollama keep_alive sent with embedding requests.
  embedding_batch_size:
    type: int
    default: 32
    description: Maximum catalog documents embedded per request, clamped from 1 to 128.
  embedding_ambiguity_margin:
    type: float
    default: 0.02
    description: Recommend semantic Top-2 when Top-1 minus Top-2 is below this margin and multi-skill evidence exists.
  embedding_min_score:
    type: float
    default: 0.35
    description: Minimum cosine score required for an implicit semantic primary with lexical evidence.
  embedding_weak_signal_min_score:
    type: float
    default: 0.45
    description: Higher cosine floor when the semantic winner has no lexical evidence in the current task.
  performance_history_limit:
    type: int
    default: 100
    description: Maximum bounded profile-local routing latency samples retained for diagnostics.
  max_audit_entries:
    type: int
    default: 100
    description: Maximum profile-local routing audit entries, clamped from 10 to 1000.
  learning_mode:
    type: str
    default: shadow
    description: "Learning mode: off or diagnostic-only shadow. Active routing feedback is unsupported."
  learning_min_samples:
    type: int
    default: 5
    description: Minimum primary-role observations before shadow bias, clamped from 3 to 100 and to the audit-history limit.
  enforcement_mode:
    type: str
    default: warn
    description: "Execution guard mode: off, warn, primary, or all."
  max_enforcement_blocks_per_turn:
    type: int
    default: 2
    description: Maximum execution guard blocks per turn before fail-open, clamped from 1 to 5.
  max_skill_chars:
    type: int
    default: 20000
    description: Maximum SKILL.md characters analyzed per skill.
  analysis_batch_size:
    type: int
    default: 6
    description: Number of changed skills analyzed in one auxiliary-model request.
  analysis_model_timeout_seconds:
    type: int
    default: 25
    description: Deep-analysis call timeout, capped at 30 seconds for clean unload.
  routing_catalog_chars:
    type: int
    default: 60000
    description: Maximum compact routing-plan characters supplied to the auxiliary model.
  routing_model_timeout_seconds:
    type: int
    default: 20
    description: Per-turn planner timeout, capped below Hermes hook timeout.
  openviking_enabled:
    type: bool
    default: false
    description: Enable the optional OpenViking bridge. v0.7.0 keeps it disabled by default.
  openviking_read_enabled:
    type: bool
    default: true
    description: Query OpenViking for semantic skill-routing evidence when the bridge itself is enabled.
  openviking_auto_write_enabled:
    type: bool
    default: true
    description: Automatically sync skill mirrors and write the generated routing plan when OpenViking is enabled.
  openviking_url:
    type: str
    default: ""
    description: OpenViking server URL; empty uses OPENVIKING_URL, OPENVIKING_ENDPOINT, or localhost.
  openviking_timeout_seconds:
    type: int
    default: 10
    description: Background OpenViking request timeout, capped at ten seconds.
  openviking_retrieval_limit:
    type: int
    default: 12
    description: Maximum OpenViking skill hits considered per task.
  openviking_routing_timeout_seconds:
    type: int
    default: 3
    description: Per-turn OpenViking retrieval timeout, capped at five seconds.
  openviking_score_threshold:
    type: float
    default: 0.15
    description: Minimum OpenViking skill retrieval score.
  openviking_plan_uri:
    type: str
    default: "viking://~/resources/hermes-skill-router/{profile}/plan.md"
    description: OpenViking resource URI for the generated routing plan.
