name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HERMES_MIN_COMMIT: 8cab422ab09332c1867af81ee4e910878ac1172b
  HERMES_VALIDATED_COMMIT: a399ac2fd13da28630d3a90c255d0be458dded61

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest==9.1.1'
      - run: python -m pytest -q
      - run: python scripts/benchmark-routing-quality.py
      - run: python scripts/check-doc-config-sync.py
      - run: python -m compileall -q .

  hermes-plugin-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hermes-commit:
          - 8cab422ab09332c1867af81ee4e910878ac1172b
          - a399ac2fd13da28630d3a90c255d0be458dded61
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check out pinned Hermes revision
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth=1 origin "${{ matrix.hermes-commit }}"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "${{ matrix.hermes-commit }}"
      - name: Run Hermes plugin security scan
        env:
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: python scripts/check-hermes-plugin-scan.py

  hermes-main-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check out current Hermes main
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth=1 origin main
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD
      - name: Informative current-main plugin scan
        env:
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: python scripts/check-hermes-plugin-scan.py
