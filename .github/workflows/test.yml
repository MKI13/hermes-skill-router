name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HERMES_SCANNER_COMMIT: 8cab422ab09332c1867af81ee4e910878ac1172b

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest==9.1.1'
      - run: python -m pytest -q
      - run: python -m compileall -q .

  hermes-plugin-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check out pinned Hermes scanner
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth=1 origin "$HERMES_SCANNER_COMMIT"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_SCANNER_COMMIT"
      - name: Run Hermes plugin security scan
        env:
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: python scripts/check-hermes-plugin-scan.py
